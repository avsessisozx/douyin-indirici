name: Windows EXE derle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Birim testleri
        run: python tools/run_tests.py tests.test_units

      - name: Uçtan uca testler (gerçek Microsoft Edge + sahte Douyin)
        env:
          DOUYIN_INDIRICI_BROWSER: msedge
          TEST_VERBOSE: "1"
        run: python tools/run_tests.py tests.test_integration

      - name: EXE derle
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name DouyinIndirici
          --icon assets/icon.ico
          --add-data "douyin_indirici/ui;douyin_indirici/ui"
          --collect-all playwright
          main.py

      - name: EXE'yi dene
        shell: pwsh
        run: |
          trap {
            $m = ($_ | Out-String) -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=EXE testi::$m"
            exit 1
          }
          function Run-Exe([string]$arg, [string]$label) {
            $out = "$PWD\selftest-$label.txt"
            $env:DOUYIN_INDIRICI_SELFTEST_OUT = $out
            Remove-Item $out -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "dist\DouyinIndirici.exe" -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "$label : zaman aşımı" }
            $r = Get-Content $out -Raw
            Write-Host "$label => $r"
            if (-not $r.StartsWith("OK")) { throw "$label başarısız: $r" }
            return $r.Trim()
          }
          "{0:N1} MB" -f ((Get-Item dist\DouyinIndirici.exe).Length / 1MB)

          # 1) Normal bilgisayar: Edge sağlam
          Run-Exe "--self-test" "normal-tarayici"
          Run-Exe "--self-test-window" "normal-pencere"

          # 2) Edge de Chrome da yok sayılırsa: program kendi tarayıcısını indirip kullanmalı
          $env:DOUYIN_INDIRICI_FORCE_BUNDLED = "1"
          $env:DOUYIN_INDIRICI_DATA = "$env:RUNNER_TEMP\di-bundled"
          $r = Run-Exe "--self-test-window" "indirilen-pencere"
          if ($r -ne "OK chromium") { throw "indirilen tarayıcı kullanılmadı: $r" }
          Run-Exe "--self-test" "indirilen-tarayici"
          Remove-Item Env:DOUYIN_INDIRICI_FORCE_BUNDLED
          Remove-Item Env:DOUYIN_INDIRICI_DATA

          # 3) Kullanıcıda görülen hata: Edge güncellemesi yarım kalmış (msedge_elf.dll eksik)
          Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          $broken = 0
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\msedge_elf.dll", "$env:ProgramFiles\Microsoft\Edge\Application\*\msedge_elf.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Rename-Item $_.FullName "msedge_elf.dll.bozuk"; $broken++
          }
          if ($broken -eq 0) { throw "Edge bozulamadı (test kurulumu)" }
          $r = Run-Exe "--self-test-window" "bozuk-edge-pencere"
          if ($r -eq "OK edge") { throw "bozuk Edge kullanılmaya çalışıldı" }
          $r = Run-Exe "--self-test" "bozuk-edge-tarayici"
          if ($r -match "Edge") { throw "bozuk Edge ile tarayıcı açılmaya çalışıldı: $r" }

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinIndirici
          path: dist/DouyinIndirici.exe

      - name: Sürüm numarasını oku
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import douyin_indirici as d; print(d.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Sürüm yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Douyin İndirici ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/DouyinIndirici.exe
          body: |
            **İndir:** aşağıdaki `DouyinIndirici.exe` dosyası. Kurulum gerekmez, çift tıklayıp aç.

            İlk açılışta Windows "Bilgisayarınız korundu" uyarısı verebilir: **Ek bilgi → Yine de çalıştır**.
            (Program imzalı olmadığı için bu uyarı çıkar.)
